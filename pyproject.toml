[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpcube"
version = "1.0.0"
description = "Florida Pasture Cube: field-level, AI-ready time series of Florida grazing lands, 2016-2026"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Hugo Rodrigues", email = "rodrigues.h@ufl.edu"}]
dependencies = [
  "geopandas>=1.0", "rasterio>=1.3", "rioxarray", "xarray", "zarr>=3", "pyarrow", "dask", "distributed",
  "odc-stac", "pystac-client", "planetary-computer", "exactextract", "shapely>=2", "pyogrio",
  "requests", "tqdm", "numpy", "pandas", "scikit-learn", "lightgbm", "matplotlib", "cmcrameri", "pillow",
  "adlfs", "torch", "pystac", "whitebox", "scipy",
]

[project.optional-dependencies]
dl = ["torch"]
test = ["pytest"]

[project.scripts]
fpcube = "fpcube.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
